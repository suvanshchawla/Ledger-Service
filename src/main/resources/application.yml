spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true # RFC 9457 Problem Details for Spring MVC exceptions
  jackson:
    deserialization:
      # Money is whole minor units. By default Jackson accepts 12.5 for a long and silently
      # truncates it to 12; reject it instead. (Feature names are bound by exact enum name.)
      ACCEPT_FLOAT_AS_INT: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
