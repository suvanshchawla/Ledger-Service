name: CI

on:
  push:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle's downloaded dependencies between runs.
      - uses: gradle/actions/setup-gradle@v4

      # Integration tests start Postgres through Testcontainers; the
      # ubuntu-latest runner already has Docker, so nothing else is needed.
      - name: Build and test
        run: ./gradlew test --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
